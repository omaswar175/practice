<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Usage Analytics</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; }
        table { width: 100%; max-width: 600px; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #1e293b; color: white; }
    </style>
</head>
<body>

    <h2>Peak Hours Analytics</h2>
    <table>
        <thead>
            <tr>
                <th>Time Slot</th>
                <th>Total Reservations</th>
            </tr>
        </thead>
        <tbody>
            {% for slot in peak_slots %}
            <tr>
                <td>{{ slot.time_slot }}</td>
                <td><strong>{{ slot.total_bookings }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
