<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Grounds Availability</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .btn { display: inline-block; background: #2563eb; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Available Sports Grounds</h2>
    <div class="grid">
        {% for ground in grounds %}
            <div class="card">
                <h3>{{ ground.name }}</h3>
                <p>Sport: <strong>{{ ground.sport_type }}</strong></p>
                <p>Location: {{ ground.location }}</p>
                <a href="{{ url_for('create_booking', ground_id=ground.id) }}" class="btn">Book Now</a>
            </div>
        {% endfor %}
    </div>
</body>
</html>
