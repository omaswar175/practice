<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reserve {{ ground.name }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; }
        .card { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .alert { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn { background: #2563eb; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reserve {{ ground.name }}</h2>
    <p>Sport: <strong>{{ ground.sport_type }}</strong> | Location: {{ ground.location }}</p>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('create_booking', ground_id=ground.id) }}">
        <div class="form-group">
            <label for="date">Select Date:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="slot">Select Time Slot:</label>
            <select id="slot" name="slot" required>
                <option value="06:00-07:00">06:00 AM - 07:00 AM</option>
                <option value="07:00-08:00">07:00 AM - 08:00 AM</option>
                <option value="08:00-09:00">08:00 AM - 09:00 AM</option>
                <option value="17:00-18:00">05:00 PM - 06:00 PM</option>
                <option value="18:00-19:00">06:00 PM - 07:00 PM</option>
            </select>
        </div>

        <button type="submit" class="btn">Confirm Ground Reservation</button>
    </form>
</div>

</body>
</html>
