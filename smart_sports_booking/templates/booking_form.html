<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reserve {{ ground.name }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 32px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 420px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; font-weight: 700; border: none; cursor: pointer; }
        .alert { background: #451a1a; color: #fca5a5; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; }
        option:disabled { color: #64748b; background: #1e293b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reserve {{ ground.name }}</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Sport: {{ ground.sport_type }} | Price: ₹{{ ground.price_per_hour or 500 }}/hr</p>

        {% if error %}<div class="alert">⚠️ {{ error }}</div>{% endif %}

        <form method="POST">
            <label>Select Date</label>
            <input type="date" id="date" name="date" required>

            <label>Select Time Slot</label>
            <select id="slot" name="slot" required>
                <option value="06:00-07:00">06:00 AM - 07:00 AM</option>
                <option value="07:00-08:00">07:00 AM - 08:00 AM</option>
                <option value="08:00-09:00">08:00 AM - 09:00 AM</option>
                <option value="17:00-18:00">05:00 PM - 06:00 PM</option>
                <option value="18:00-19:00">06:00 PM - 07:00 PM</option>
            </select>

            <button type="submit">Confirm Reservation</button>
        </form>
        <a href="{{ url_for('ground_list') }}" style="color: #94a3b8; text-decoration: none; display: block; text-align: center; margin-top: 10px;">← Back to Grounds</a>
    </div>

    <script>
        const dateInput = document.getElementById('date');
        const slotSelect = document.getElementById('slot');
        
        // Prevent past dates
        dateInput.min = new Date().toISOString().split('T')[0];

        // Fetch already booked slots when date changes
        dateInput.addEventListener('change', async () => {
            const date = dateInput.value;
            if (!date) return;

            const res = await fetch(`/api/booked-slots/{{ ground.id }}/${date}`);
            const data = await res.json();

            Array.from(slotSelect.options).forEach(opt => {
                if (data.booked_slots.includes(opt.value)) {
                    opt.disabled = true;
                    opt.textContent = opt.value + " (Already Booked)";
                } else {
                    opt.disabled = false;
                    opt.textContent = opt.value;
                }
            });
        });
    </script>
</body>
</html>
